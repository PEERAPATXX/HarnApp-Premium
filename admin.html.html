<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harnapp - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; margin-bottom: 20px; color: #0f172a; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f8fafc; color: #64748b; font-weight: 600; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; display: inline-block; }
        .st-free { background: #dcfce7; color: #166534; }
        .st-busy { background: #fee2e2; color: #991b1b; }
        .refresh-btn { background: #ec4899; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; float: right; }
        .refresh-btn:hover { background: #db2777; }
    </style>
</head>
<body>

<div class="container">
    <button class="refresh-btn" onclick="loadStockData()">🔄 รีเฟรชสต็อก</button>
    <h1>⚙️ รายการสต็อกปัจจุบัน (Harnapp Admin)</h1>

    <table>
        <thead>
            <tr>
                <th>สินค้า</th>
                <th>ข้อมูลเมล / โปรไฟล์</th>
                <th>สถานะ</th>
                <th>วันหมดอายุ</th>
            </tr>
        </thead>
        <tbody id="stock-list">
            <tr><td colspan="4" style="text-align:center;">กำลังดึงข้อมูลจาก Cloudflare Workers...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const WORKER_URL = "https://harnapp-api.hay-peerapattx-co-th.workers.dev"; 

    async function loadStockData() {
        const tbody = document.getElementById('stock-list');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';

        try {
            const res = await fetch(WORKER_URL);
            const data = await res.json();
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ไม่พบข้อมูลสต็อก</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(item => {
                const isFree = item.status === 'ว่าง';
                tbody.innerHTML += `
                    <tr>
                        <td><b>${item.code}</b></td>
                        <td>${item.email}</td>
                        <td>
                            <span class="status-badge ${isFree ? 'st-free' : 'st-busy'}">
                                ${item.status}
                            </span>
                        </td>
                        <td>${item.expire || '-'}</td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("เกิดข้อผิดพลาด:", err);
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">ดึงข้อมูลไม่สำเร็จ ตรวจสอบ Worker URL</td></tr>';
        }
    }

    window.onload = loadStockData;
</script>

</body>
</html>
