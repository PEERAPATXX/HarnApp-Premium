<script>
    // ใส่ URL ของ Cloudflare Worker ของคุณตรงนี้
    const WORKER_URL = "https://your-worker-name.your-subdomain.workers.dev"; 

    async function loadStockData() {
        const tbody = document.getElementById('stock-list');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">กำลังโหลด...</td></tr>';

        try {
            const res = await fetch(WORKER_URL);
            const data = await res.json();
            
            if (data.error) throw new Error(data.error);

            tbody.innerHTML = '';
            data.forEach((item) => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${item.code}</b></td>
                        <td>${item.email}</td>
                        <td>
                            <select class="${item.status === 'ว่าง' ? 'free' : 'busy'}" 
                                    onchange="updateStatus(${item.row}, this.value)">
                                <option value="ว่าง" ${item.status === 'ว่าง' ? 'selected' : ''}>ว่าง</option>
                                <option value="ไม่ว่าง" ${item.status !== 'ว่าง' ? 'selected' : ''}>ไม่ว่าง</option>
                            </select>
                        </td>
                        <td>${item.expire}</td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">ดึงข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
        }
    }

    async function updateStatus(rowNum, newStatus) {
        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    row: rowNum,
                    status: newStatus
                })
            });

            const result = await res.json();
            if (result.error) throw new Error(result.error);

            alert(`อัปเดตบรรทัดที่ ${rowNum} เป็น "${newStatus}" เรียบร้อย!`);
            loadStockData(); // โหลดหน้าใหม่เพื่ออัปเดตสถานะและสี
        } catch (err) {
            alert('แก้ไขไม่สำเร็จ: ' + err.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadStockData);
</script>
