<script>
    // ใส่ URL ที่มึงก๊อปปี้มาจาก SheetDB ตรงนี้
    const SHEETDB_URL = "https://sheetdb.io/api/v1/5xaf2rla9nky0"; 

    async function loadStockData() {
        const tbody = document.getElementById('stock-list');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">กำลังโหลด...</td></tr>';

        try {
            const res = await fetch(SHEETDB_URL);
            const data = await res.json();
            
            tbody.innerHTML = '';
            data.forEach((item, index) => {
                // SheetDB ส่งข้อมูลมาเป็น Object ตามชื่อหัวคอลัมน์
                // เช็กชื่อหัวคอลัมน์ใน Sheet มึง (รหัสสินค้า, เมล / โปรไฟล์, สถานะ (Status), จำนวนวัน, วันหมดอายุ)
                tbody.innerHTML += `
                    <tr>
                        <td><b>${item['รหัสสินค้า (Code)'] || '-'}</b></td>
                        <td>${item['เมล / โปรไฟล์'] || '-'}</td>
                        <td>
                            <select class="${item['สถานะ (Status)'] === 'ว่าง' ? 'free' : 'busy'}" 
                                    onchange="updateStatus('${item['รหัสสินค้า (Code)']}', this.value)">
                                <option value="ว่าง" ${item['สถานะ (Status)'] === 'ว่าง' ? 'selected' : ''}>ว่าง</option>
                                <option value="ไม่ว่าง" ${item['สถานะ (Status)'] !== 'ว่าง' ? 'selected' : ''}>ไม่ว่าง</option>
                            </select>
                        </td>
                        <td>${item['วันหมดอายุ'] || '-'}</td>
                    </tr>
                `;
            });
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">ดึงข้อมูลไม่สำเร็จ</td></tr>';
        }
    }

    async function updateStatus(code, newStatus) {
        // อัปเดตผ่าน API ของ SheetDB โดยอ้างอิงจากคอลัมน์ "รหัสสินค้า (Code)"
        try {
            await fetch(`${SHEETDB_URL}/รหัสสินค้า%20(Code)/${code}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: { 'สถานะ (Status)': newStatus } })
            });
            alert('อัปเดตสถานะเป็น ' + newStatus + ' เรียบร้อย');
        } catch (err) {
            alert('แก้ไขไม่สำเร็จ!');
        }
    }

    window.onload = loadStockData;
</script>
