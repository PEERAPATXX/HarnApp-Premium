<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harnapp Admin - ระบบจัดการสต็อก</title>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --magenta-bg: #050505;
            --magenta-bright: #ff007f;
            --purple-witch: #050505;
            --purple-dark: #23082a;
            --blue-hair: #38bdf8;
            --card-bg: rgba(255, 255, 255, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--purple-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, var(--magenta-bg) 0%, transparent 75%),
                radial-gradient(circle at 100% 100%, var(--purple-witch) 0%, transparent 50%);
            background-attachment: fixed;
            color: #262626;
            padding: 16px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 1. แบนเนอร์หลัก */
        .banner-slot {
            width: 100%;
            aspect-ratio: 1983 / 793;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(236, 0, 140, 0.35);
            background: var(--purple-witch);
            flex-shrink: 0;
        }

        .banner-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 2. Main Dashboard Card */
        .dashboard-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        /* 3. Category Tabs */
        .category-tabs {
            display: flex;
            gap: 8px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 40px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 8px 18px;
            border-radius: 30px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.88rem;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn img.tab-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 4px;
        }

        .tab-btn.active {
            background: var(--magenta-bright);
            color: #ffffff;
            box-shadow: 0 3px 12px rgba(255, 0, 127, 0.35);
        }

        .tab-btn:hover:not(.active) {
            color: var(--purple-witch);
            background: rgba(255, 0, 127, 0.1);
        }

        /* ปุ่ม Refresh & Add */
        .btn-refresh {
            background: var(--purple-witch);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-refresh:hover {
            background: #334155;
            transform: translateY(-1px);
        }

        .btn-add {
            background: var(--magenta-bright);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(255, 0, 127, 0.3);
        }

        .btn-add:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* 4. Table Wrapper */
        .table-wrapper {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            -webkit-overflow-scrolling: touch;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--magenta-bright);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left;
            font-size: 0.9rem;
        }

        th { 
            background: var(--purple-witch);
            color: #ffffff; 
            font-weight: 600;
            padding: 14px 16px;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td { 
            padding: 12px 16px; 
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #fff1f7; }

        select { 
            padding: 5px 10px; 
            border-radius: 16px; 
            font-weight: 700; 
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer; 
            border: none;
            outline: none;
        }

        /* กล่องใส่วันที่ + ปุ่มลบ */
        .date-picker-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        input[type="date"], input[type="text"], select.form-control { 
            padding: 6px 10px; 
            border-radius: 6px; 
            border: 1px solid #cbd5e1; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 0.85rem;
            color: #334155;
            background-color: #fff;
            outline: none;
            width: 100%;
        }

        input[type="date"]:focus, input[type="text"]:focus, select.form-control:focus {
            border-color: var(--magenta-bright);
        }

        /* ปุ่ม X สำหรับกดล้างวันที่ */
        .btn-clear-date {
            background: #ffe4e6;
            color: #be123c;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-clear-date:active {
            transform: scale(0.9);
            background: var(--magenta-bright);
            color: #fff;
        }

        .free { background-color: #dcfce7; color: #166534; }
        .busy { background-color: #ffe4e6; color: #9f1239; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-normal { background-color: #f1f5f9; color: #475569; }
        .expired { background-color: #ffe4e6; color: #be123c; font-weight: 700; }
        .soon { background-color: #fef3c7; color: #b45309; font-weight: 700; }

        .font-code { font-family: monospace; font-size: 0.95rem; font-weight: 700; color: var(--purple-witch); }
        .text-center { text-align: center; }
        .text-muted { color: #94a3b8; }

        /* 5. Modal Popup สำหรับเพิ่มสินค้า */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.open { display: flex; }

        .modal-content {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 { font-size: 1.1rem; color: #0f172a; }
        .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #475569; }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .btn-submit {
            flex: 1;
            background: var(--magenta-bright);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        /* 📱 MOBILE RESPONSIVE DESIGN */
        @media (max-width: 650px) {
            body {
                padding: 10px 8px;
            }

            .banner-slot {
                border-radius: 12px;
                margin-bottom: 10px;
            }

            .dashboard-card {
                padding: 10px;
                border-radius: 16px;
            }

            .top-bar {
                flex-direction: row;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
            }

            .category-tabs {
                flex: 1;
                padding: 4px;
            }

            .tab-btn {
                padding: 6px 10px;
                font-size: 0.78rem;
            }

            .btn-refresh, .btn-add {
                padding: 6px 10px;
                font-size: 0.78rem;
            }

            .table-wrapper {
                border: none;
                background: transparent;
                padding-right: 4px;
            }

            table, thead, tbody, th, td, tr { 
                display: block; 
            }

            thead tr { 
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr { 
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                margin-bottom: 10px;
                padding: 10px 12px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            }

            td { 
                border: none;
                padding: 5px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.85rem;
            }

            td::before { 
                content: attr(data-label);
                font-weight: 600;
                color: #64748b;
                font-size: 0.8rem;
            }

            td:first-child {
                border-bottom: 1px dashed #e2e8f0;
                padding-bottom: 6px;
                margin-bottom: 4px;
            }

            td.empty-row {
                justify-content: center;
            }

            td.empty-row::before {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ป้าย Banner หลัก -->
        <div class="banner-slot">
            <img src="banner.png" alt="Harnapp Admin Banner">
        </div>

        <!-- Main Dashboard Card -->
        <div class="dashboard-card">
            
            <div class="top-bar">
                <div class="category-tabs">
                    <button class="tab-btn active" onclick="switchCategory('ALL', this)">
                        <img src="https://cdn-icons-png.flaticon.com/512/839/839888.png" alt="All" class="tab-icon">
                        ทั้งหมด
                    </button>

                    <button class="tab-btn" onclick="switchCategory('NETFLIX', this)">
                        <img src="https://cdn-icons-png.flaticon.com/512/732/732228.png" alt="Netflix" class="tab-icon">
                        Netflix
                    </button>

                    <button class="tab-btn" onclick="switchCategory('YOUTUBE', this)">
                        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" class="tab-icon">
                        YouTube
                    </button>
                </div>

                <div class="action-btns">
                    <button class="btn-add" onclick="openAddModal()">+ เพิ่มสินค้า</button>
                    <button class="btn-refresh" onclick="loadStockData()">รีเฟรช</button>
                </div>
            </div>

            <!-- ส่วนตารางแสดงสินค้า -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>รหัสสินค้า</th>
                            <th>อีเมล</th>
                            <th>สถานะ</th>
                            <th>จำนวนวัน</th>
                            <th>วันหมดอายุ</th>
                        </tr>
                    </thead>
                    <tbody id="stock-list">
                        <tr>
                            <td colspan="5" class="text-center text-muted empty-row">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Modal เพิ่มรายการใหม่ -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>เพิ่มข้อมูลสินค้าเข้าสต็อก</h3>
                <button class="close-btn" onclick="closeAddModal()">✕</button>
            </div>
            <form id="addStockForm" onsubmit="handleAddSubmit(event)">
                <div class="form-group">
                    <label>หมวดหมู่ / Prefixes</label>
                    <select id="add-category" class="form-control" required>
                        <option value="YOUTUBE">YouTube (YT)</option>
                        <option value="NETFLIX">Netflix (NF)</option>
                        <option value="OTHER">อื่นๆ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>รหัสสินค้า (Code)</label>
                    <input type="text" id="add-code" placeholder="เช่น YT-01 หรือ NF-01" required>
                </div>
                <div class="form-group">
                    <label>อีเมลลูกค้า / ไอดี</label>
                    <input type="text" id="add-email" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>วันหมดอายุ</label>
                    <input type="date" id="add-expire">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddModal()">ยกเลิก</button>
                    <button type="submit" class="btn-submit">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://harnapp-api.hay-peerapattx-co-th.workers.dev"; 
        
        let rawStockData = [];
        let currentCategory = 'ALL';

        function toDateInputValue(str) {
            if (!str || str === '-' || str.trim() === '') return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
            const match = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (match) {
                const [, d, m, y] = match;
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return '';
        }

        function daysRemaining(expireStr) {
            const iso = toDateInputValue(expireStr);
            if (!iso) return { text: '-', cls: 'badge-normal' };
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expireDate = new Date(iso + 'T00:00:00');
            const diff = Math.round((expireDate - today) / (1000 * 60 * 60 * 24));
            
            if (diff < 0) return { text: `หมดอายุแล้ว ${Math.abs(diff)} วัน`, cls: 'expired' };
            if (diff === 0) return { text: 'หมดอายุวันนี้', cls: 'expired' };
            if (diff <= 3) return { text: `เหลือ ${diff} วัน`, cls: 'soon' };
            return { text: `เหลือ ${diff} วัน`, cls: 'badge-normal' };
        }

        async function loadStockData() {
            const tbody = document.getElementById('stock-list');
            if (!tbody) return;
            
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted empty-row">กำลังโหลดข้อมูล...</td></tr>';

            try {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                rawStockData = Array.isArray(data) ? data : [];
                renderTable();

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center empty-row" style="color:var(--magenta-bright);">ดึงข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('stock-list');
            tbody.innerHTML = '';

            let filteredData = rawStockData.filter(item => {
                if (currentCategory === 'ALL') return true;
                
                const searchStr = `${item.code} ${item.email}`.toUpperCase();
                if (currentCategory === 'NETFLIX') return searchStr.includes('NETFLIX') || searchStr.includes('NF');
                if (currentCategory === 'YOUTUBE') return searchStr.includes('YOUTUBE') || searchStr.includes('YT');
                if (currentCategory === 'DISNEY') return searchStr.includes('DISNEY') || searchStr.includes('DIS');
                return true;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted empty-row">ไม่มีข้อมูลในหมวดหมู่นี้</td></tr>';
                return;
            }

            filteredData.forEach((item) => {
                const statusObj = daysRemaining(item.expire);
                tbody.innerHTML += `
                    <tr>
                        <td data-label="รหัสสินค้า" class="font-code">${item.code}</td>
                        <td data-label="อีเมล"><b>${item.email}</b></td>
                        <td data-label="สถานะ">
                            <select class="${item.status === 'ว่าง' ? 'free' : 'busy'}" 
                                    onchange="updateStatus(${item.row}, this.value)">
                                <option value="ว่าง" ${item.status === 'ว่าง' ? 'selected' : ''}>ว่าง</option>
                                <option value="ไม่ว่าง" ${item.status !== 'ว่าง' ? 'selected' : ''}>ไม่ว่าง</option>
                            </select>
                        </td>
                        <td data-label="จำนวนวัน">
                            <span class="badge ${statusObj.cls}">${statusObj.text}</span>
                        </td>
                        <td data-label="วันหมดอายุ">
                            <div class="date-picker-group">
                                <input type="date"
                                       id="date-input-${item.row}"
                                       value="${toDateInputValue(item.expire)}"
                                       onchange="updateExpire(${item.row}, this.value)"
                                       oninput="handleDateInput(${item.row}, this)">
                                <button type="button" class="btn-clear-date" title="ล้างวันที่" onclick="clearDate(${item.row})">✕</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function switchCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderTable();
        }

        /* เปิด / ปิด Modal เพิ่มสินค้า */
        function openAddModal() {
            document.getElementById('addModal').classList.add('open');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('open');
            document.getElementById('addStockForm').reset();
        }

        /* ฟังก์ชันส่งค่าเพิ่มข้อมูลสินค้าใหม่ */
        async function handleAddSubmit(event) {
            event.preventDefault();

            const code = document.getElementById('add-code').value;
            const email = document.getElementById('add-email').value;
            const expire = document.getElementById('add-expire').value || '-';

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'add',
                        code: code,
                        email: email,
                        status: 'ว่าง',
                        expire: expire
                    })
                });

                const result = await res.json();
                if (result.error) throw new Error(result.error);

                alert('เพิ่มข้อมูลสำเร็จ!');
                closeAddModal();
                loadStockData();
            } catch (err) {
                alert('เพิ่มข้อมูลไม่สำเร็จ: ' + err.message);
            }
        }

        async function updateStatus(rowNum, newStatus) {
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row: rowNum, status: newStatus })
                });

                const result = await res.json();
                if (result.error) throw new Error(result.error);
                loadStockData();
            } catch (err) {
                alert('แก้ไขไม่สำเร็จ: ' + err.message);
            }
        }

        function handleDateInput(rowNum, inputElem) {
            if (!inputElem.value) {
                updateExpire(rowNum, '-');
            }
        }

        function clearDate(rowNum) {
            const inputElem = document.getElementById(`date-input-${rowNum}`);
            if (inputElem) {
                inputElem.value = '';
            }
            updateExpire(rowNum, '-');
        }

        async function updateExpire(rowNum, newExpire) {
            const expireValueToSend = (newExpire && newExpire.trim() !== '') ? newExpire : '-';

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row: rowNum, expire: expireValueToSend })
                });

                const result = await res.json();
                if (result.error) throw new Error(result.error);
                loadStockData();
            } catch (err) {
                alert('แก้ไขไม่สำเร็จ: ' + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadStockData);
    </script>
