<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต็อก - Admin</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #333; color: white; }
        select { padding: 5px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        input[type="date"] { padding: 5px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; font-family: inherit; }
        .free { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .busy { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .expired { color: #a94442; font-weight: bold; }
        .soon { color: #b8860b; font-weight: bold; }
    </style>
</head>
<body>

    <h2>รายการสินค้าในสต็อก</h2>
    
    <table>
        <thead>
            <tr>
                <th>รหัสสินค้า (Code)</th>
                <th>อีเมล (Email)</th>
                <th>สถานะ (Status)</th>
                <th>จำนวนวัน (Days Left)</th>
                <th>วันหมดอายุ (Expire)</th>
            </tr>
        </thead>
        <tbody id="stock-list">
            <tr>
                <td colspan="5" style="text-align:center;">กำลังโหลด...</td>
            </tr>
        </tbody>
    </table>

    <script>
        // ใส่ URL ของ Cloudflare Worker ของคุณแล้ว
        const WORKER_URL = "https://harnapp-api.hay-peerapattx-co-th.workers.dev"; 

        // แปลงค่าวันที่จาก Google Sheet ให้เป็นรูปแบบ YYYY-MM-DD ที่ <input type="date"> ต้องการ
        // รองรับทั้งกรณีที่ Sheet เก็บเป็น YYYY-MM-DD อยู่แล้ว และกรณี DD/MM/YYYY
        function toDateInputValue(str) {
            if (!str || str === '-') return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
            const match = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (match) {
                const [, d, m, y] = match;
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return '';
        }

        // คำนวณจำนวนวันที่เหลือจากวันนี้ถึงวันหมดอายุ (คำนวณสดทุกครั้งที่โหลดหน้า)
        function daysRemaining(expireStr) {
            const iso = toDateInputValue(expireStr);
            if (!iso) return { text: '-', cls: '' };
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expireDate = new Date(iso + 'T00:00:00');
            const diff = Math.round((expireDate - today) / (1000 * 60 * 60 * 24));
            if (diff < 0) return { text: `หมดอายุแล้ว ${Math.abs(diff)} วัน`, cls: 'expired' };
            if (diff === 0) return { text: 'หมดอายุวันนี้', cls: 'expired' };
            if (diff <= 3) return { text: `เหลือ ${diff} วัน`, cls: 'soon' };
            return { text: `เหลือ ${diff} วัน`, cls: '' };
        }

        async function loadStockData() {
            const tbody = document.getElementById('stock-list');
            if (!tbody) return;
            
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';

            try {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                tbody.innerHTML = '';
                
                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">ไม่มีข้อมูลในระบบ</td></tr>';
                    return;
                }

                data.forEach((item) => {
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${item.code}</b></td>
                            <td>${item.email}</td>
                            <td>
                                <select class="${item.status === 'ว่าง' ? 'free' : 'busy'}" 
                                        onchange="updateStatus(${item.row}, this.value)">
                                    <option value="ว่าง" ${item.status === 'ว่าง' ? 'selected' : ''}>ว่าง</option>
                                    <option value="ไม่ว่าง" ${item.status !== 'ว่าง' ? 'selected' : ''}>ไม่ว่าง</option>
                                </select>
                            </td>
                            <td class="${daysRemaining(item.expire).cls}">${daysRemaining(item.expire).text}</td>
                            <td>
                                <input type="date"
                                       value="${toDateInputValue(item.expire)}"
                                       onchange="updateExpire(${item.row}, this.value)">
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">ดึงข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
            }
        }

        async function updateStatus(rowNum, newStatus) {
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        row: rowNum,
                        status: newStatus
                    })
                });

                const result = await res.json();
                if (result.error) throw new Error(result.error);

                alert(`อัปเดตบรรทัดที่ ${rowNum} เป็น "${newStatus}" เรียบร้อย!`);
                loadStockData();
            } catch (err) {
                alert('แก้ไขไม่สำเร็จ: ' + err.message);
            }
        }

        async function updateExpire(rowNum, newExpire) {
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        row: rowNum,
                        expire: newExpire
                    })
                });

                const result = await res.json();
                if (result.error) throw new Error(result.error);

                alert(`อัปเดตวันหมดอายุบรรทัดที่ ${rowNum} เรียบร้อย!`);
                loadStockData();
            } catch (err) {
                alert('แก้ไขไม่สำเร็จ: ' + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadStockData);
    </script>
</body>
</html>
