<script>
    const SHEETDB_URL = "https://sheetdb.io/api/v1/5xaf2rla9nky0"; 

    async function loadStockData() {
        const tbody = document.getElementById('stock-list');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">กำลังโหลด...</td></tr>';

        try {
            const res = await fetch(SHEETDB_URL);
            const data = await res.json();
            
            tbody.innerHTML = '';
            data.forEach((item) => {
                // ดึงชื่อคอลัมน์มาแบบ Array เพื่อป้องกันปัญหาอักขระพิเศษ
                const keys = Object.keys(item);
                const code = item[keys[0]]; // รหัสสินค้า
                const email = item[keys[1]]; // เมล
                const status = item[keys[2]]; // สถานะ
                const expire = item[keys[4]]; // วันหมดอายุ
                
                tbody.innerHTML += `
                    <tr>
                        <td><b>${code || '-'}</b></td>
                        <td>${email || '-'}</td>
                        <td>
                            <select class="${status === 'ว่าง' ? 'free' : 'busy'}" 
                                    onchange="updateStatus('${code}', this.value)">
                                <option value="ว่าง" ${status === 'ว่าง' ? 'selected' : ''}>ว่าง</option>
                                <option value="ไม่ว่าง" ${status !== 'ว่าง' ? 'selected' : ''}>ไม่ว่าง</option>
                            </select>
                        </td>
                        <td>${expire || '-'}</td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">ดึงข้อมูลไม่สำเร็จ</td></tr>';
        }
    }

    async function updateStatus(code, newStatus) {
        try {
            // ใช้ encodeURIComponent เพื่อป้องกันปัญหาอักขระใน URL
            const url = `${SHEETDB_URL}/รหัสสินค้า%20(Code)/${encodeURIComponent(code)}`;
            await fetch(url, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: { 'สถานะ (Status)': newStatus } })
            });
            alert('อัปเดตเป็น ' + newStatus + ' เรียบร้อย');
        } catch (err) {
            alert('แก้ไขไม่สำเร็จ!');
        }
    }

    window.onload = loadStockData;
</script>
